<!doctype html>

    <meta name="supported-color-schemes" content="light" />

    <meta name="darkreader-lock" />
    <meta name="darkreader" content="NO-DARK-READER" />
    
    <!-- Immunity against Dark Mode extensions and force-dark injectors -->
    <script>
      (() => {
        try {
          document.documentElement.style.setProperty('color-scheme', 'only light', 'important');
          const killDarkReader = () => {
            const injected = document.querySelectorAll('style.darkreader, link.darkreader');
            if (injected.length > 0) {
              injected.forEach((el) => el.remove());
            }
            if (document.documentElement.classList.contains('darkreader')) {
              document.documentElement.classList.remove('darkreader');
            }
            if (document.documentElement.hasAttribute('data-darkreader-mode')) {
              document.documentElement.removeAttribute('data-darkreader-mode');
              document.documentElement.removeAttribute('data-darkreader-scheme');
            }
          };
          killDarkReader();
          const observer = new MutationObserver(killDarkReader);
          observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true });
          window.addEventListener('DOMContentLoaded', killDarkReader);
        } catch (_) {}
      })();
    </script>
    <title>QRAEZEV — The Experience Layer for Physical AI</title>

  <body class="bg-[#F3F1EA] text-[#15120E] antialiased selection:bg-[#FFB800]/30 selection:text-[#15120E]">
    <!-- Loading Screen with Exact Logo Animation -->
    <div id="loader" style="position:fixed;inset:0;z-index:99999;background:#F3F1EA;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity 0.7s cubic-bezier(0.16,1,0.3,1);cursor:pointer;">
      <svg id="svg" viewBox="-40 -30 454 479" role="img" aria-label="Logo animation" style="width:min(340px,80vw);height:auto;overflow:visible;">
        <defs>
          <linearGradient id="gA" gradientUnits="userSpaceOnUse" x1="7.5" y1="-7.5" x2="250.5" y2="235.5">
            <stop offset="0" stop-color="#d6d6d6"/>
            <stop offset=".55" stop-color="#888888"/>
            <stop offset="1" stop-color="#212121"/>
          </linearGradient>
          <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset=".5" stop-color="#ffffff" stop-opacity=".25"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <g id="unit">
            <polygon id="fold" fill="url(#gA)"/>
            <polygon id="front" fill="#080808"/>
            <polygon id="shine" fill="url(#sheen)" points="144,0 258,0 88,228 0,160"/>
          </g>
        </defs>

        <g id="logo">
          <use id="g5" href="#unit" opacity="0"/><use id="g4" href="#unit" opacity="0"/>
          <use id="g3" href="#unit" opacity="0"/><use id="g2" href="#unit" opacity="0"/>
          <use id="g1" href="#unit" opacity="0"/>
          <use id="twin" href="#unit" opacity="0"/>
          <use id="base" href="#unit"/>
        </g>
      </svg>
      <div style="position:absolute;bottom:2rem;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(21,18,14,0.4);pointer-events:none;user-select:none;">
        Click anywhere to enter · [Esc]
      </div>
    </div>

    <script>
    (() => {
      const CX = 187, CY = 209.5, LOOP = 9.8;
      const $ = id => document.getElementById(id);
      const clamp = x => Math.min(1, Math.max(0, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a));
      const easeOut = x => 1 - Math.pow(1 - x, 3);
      const easeIn  = x => x * x * x;
      const easeIO  = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      const fmt = a => a.map(p => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' ');

      const svg = $('svg'), logo = $('logo'), front = $('front'), fold = $('fold'),
            sheen = $('sheen'), twin = $('twin'),
            base = $('base'), ghosts = [1,2,3,4,5].map(k => $('g' + k)), loader = $('loader');

      const P1 = [144,0], P2 = [258,0], P3 = [88,228], P4 = [0,160];
      const lerp = (a, b, u) => [a[0] + (b[0]-a[0])*u, a[1] + (b[1]-a[1])*u];

      let dismissed = false;
      function dismiss() {
        if (dismissed || !loader) return;
        dismissed = true;
        loader.style.opacity = '0';
        loader.style.pointerEvents = 'none';
        document.body.style.overflow = '';
        setTimeout(() => { if (loader && loader.parentNode) loader.parentNode.removeChild(loader); }, 750);
      }

      loader.addEventListener('click', dismiss);
      window.addEventListener('keydown', e => {
        if (e.key === 'Escape' || e.key === ' ' || e.key === 'Enter') dismiss();
      });
      document.body.style.overflow = 'hidden';

      function frame(t) {
        // 1. Unit A: front unrolls from its top edge, fold opens like paper
        const u = easeOut(seg(t, .2, 1.5));
        front.setAttribute('points', fmt([P1, P2, lerp(P2, P3, u), lerp(P1, P4, u)]));
        const s = easeOut(seg(t, 1.0, 1.9));
        const fx = x => 258 - (258 - x) * s;
        fold.setAttribute('points', fmt([[fx(258),0],[fx(258),196],[fx(165),128]]));

        // 2. Twin swings 180 degrees around the centre, leaving a trail
        const sw = easeIO(seg(t, 2.5, 4.7)), th = 180 * sw;
        twin.setAttribute('opacity', seg(t, 2.5, 2.7).toFixed(3));
        twin.setAttribute('transform', `rotate(${th.toFixed(3)} ${CX} ${CY})`);
        const trail = seg(t, 2.6, 3.0) * (1 - seg(t, 4.3, 4.8));
        ghosts.forEach((g, i) => {
          const ang = Math.max(0, th - 7 * (i + 1));
          g.setAttribute('transform', `rotate(${ang.toFixed(3)} ${CX} ${CY})`);
          g.setAttribute('opacity', ((.22 - .035 * (i + 1)) * trail).toFixed(3));
        });

        // 4. Landing flash
        const f = seg(t, 4.6, 5.4), glow = Math.sin(Math.PI * f);
        svg.style.filter = glow > .002
          ? `drop-shadow(0 0 ${(30 * glow).toFixed(1)}px rgba(0,0,0,${(.45 * glow).toFixed(3)}))`
          : 'none';

        // 5. Light sweep across the ribbons
        const d = 20 + 270 * easeIO(seg(t, 5.4, 6.8)), nx = .8, ny = .6, hw = 60;
        sheen.setAttribute('x1', (nx * (d - hw)).toFixed(2)); sheen.setAttribute('y1', (ny * (d - hw)).toFixed(2));
        sheen.setAttribute('x2', (nx * (d + hw)).toFixed(2)); sheen.setAttribute('y2', (ny * (d + hw)).toFixed(2));

        // 6. Gentle breathing, then spin-away exit
        const e = easeIn(seg(t, 7.9, 9.3));
        const sc = (1 + .025 * glow + .008 * Math.sin(t * 1.6) * seg(t, 5.4, 7.8)) * (1 - .15 * e);
        logo.setAttribute('transform',
          `translate(${CX} ${CY}) rotate(${(-90 * e).toFixed(3)}) scale(${sc.toFixed(4)}) translate(${-CX} ${-CY})`);
        svg.style.opacity = (1 - e).toFixed(3);
      }

      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        frame(6.9);
        setTimeout(dismiss, 1200);
        return;
      }
      const t0 = performance.now();
      (function loop(now) {
        if (dismissed) return;
        const elapsed = (now - t0) / 1000;
        frame(elapsed % LOOP);
        if (elapsed >= 9.35) {
          dismiss();
          return;
        }
        requestAnimationFrame(loop);
      })(t0);
    })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
